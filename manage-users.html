
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            color: #173b36;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        a, button {
            display: inline-block;
            padding: 10px 14px;
            margin: 10px 5px 15px 0;
            background: #16845c;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .table-box {
            overflow-x: auto;
            background: white;
            padding: 12px;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #173b36;
            color: white;
        }

        tr:nth-child(even) {
            background: #f4f7f5;
        }
    </style>
</head>

<body>

    <h1>Manage Users</h1>
    <p>Registered NGO users and their details.</p>

    <a href="admindashboard.html">Back to Dashboard</a>
    <button onclick="showUsers()">Refresh Users</button>

    <div class="table-box">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Mobile</th>
                    <th>Role</th>
                </tr>
            </thead>

            <tbody id="userTable"></tbody>
        </table>
    </div>

    <script>
        if (localStorage.getItem("adminLoggedIn") !== "true") {
            window.location.replace("admin.html");
        }

        function showUsers() {
            var users = JSON.parse(
                localStorage.getItem("users") || "[]"
            );

            var table = document.getElementById("userTable");
            table.innerHTML = "";

            var normalUsers = users.filter(function(user) {
                return user.role === "User";
            });

            if (normalUsers.length === 0) {
                table.innerHTML =
                    '<tr><td colspan="4">No registered users found.</td></tr>';
                return;
            }

            normalUsers.forEach(function(user) {
                var row = document.createElement("tr");

                [user.name, user.email, user.mobile, user.role]
                    .forEach(function(value) {
                        var cell = document.createElement("td");
                        cell.textContent = value || "-";
                        row.appendChild(cell);
                    });

                table.appendChild(row);
            });
        }

        showUsers();
    </script>

</body>
</html>
